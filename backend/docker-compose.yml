# Local development database only. Credentials come from backend/.env (git-ignored); see "Local setup" in backend/README.md.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # The three values below are read from backend/.env when compose starts. If one is missing, the postgres image
    # refuses to start and says so, so nothing runs with a blank password.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
